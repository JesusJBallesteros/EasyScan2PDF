<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Documents are processed in this tab only: no network requests are allowed. -->
<meta http-equiv="Content-Security-Policy" content="connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1f6feb">
<title>EasyScan2PDF</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<header>
  <h1>EasyScan2PDF</h1>
  <button id="openBtn" class="primary" data-i18n="open">Open…</button>
  <input id="fileInput" type="file" accept="application/pdf,.pdf,image/jpeg,image/png" multiple hidden>
  <span id="docName"></span>
  <label class="inline"><span data-i18n="pagesPerSheet">Pages per sheet</span>
    <select id="layoutSel">
      <option value="auto" data-i18n="layoutAuto">Auto</option>
      <option value="1">1</option>
      <option value="2" data-i18n="layout2">2 (left | right)</option>
      <option value="2v" data-i18n="layout2v">2 (top | bottom)</option>
    </select>
  </label>
  <label class="inline"><span data-i18n="readingOrder">Reading order</span>
    <select id="order">
      <option value="ltr" data-i18n="ltr">Left to right</option>
      <option value="rtl" data-i18n="rtl">Right to left</option>
    </select>
  </label>
  <span id="status"></span>
  <select id="lang" data-i18n-title="language" data-i18n-label="language"></select>
  <select id="theme" data-i18n-title="theme" data-i18n-label="theme">
    <option value="auto" data-i18n="themeAuto">Theme: system</option>
    <option value="light" data-i18n="themeLight">Theme: light</option>
    <option value="dark" data-i18n="themeDark">Theme: dark</option>
  </select>
  <button id="installBtn" hidden data-i18n="install" data-i18n-title="installTitle">Install app</button>
</header>

<main>
  <aside id="thumbs" data-i18n-label="sheets"></aside>

  <section id="center">
    <div id="toolbar" hidden>
      <button id="prevBtn" data-i18n-title="prevTitle">◀</button>
      <span id="sheetLabel"></span>
      <button id="nextBtn" data-i18n-title="nextTitle">▶</button>
      <span class="sep"></span>
      <span class="seg">
        <button id="oneBtn" data-i18n="onePage" data-i18n-title="onePageTitle">1 page</button>
        <button id="twoBtn" data-i18n="twoPages" data-i18n-title="twoPagesTitle">2 pages</button>
      </span>
      <button id="resetBtn" data-i18n="reset" data-i18n-title="resetTitle">Reset sheet</button>
      <select id="applySel" data-i18n-title="applyTitle">
        <option value="" data-i18n="applyTo">Apply areas to…</option>
        <option value="all" data-i18n="applyAll">All sheets</option>
        <option value="after" data-i18n="applyAfter">This sheet onwards</option>
        <option value="left" data-i18n="applyLeft">Left pages of all sheets</option>
        <option value="right" data-i18n="applyRight">Right pages of all sheets</option>
      </select>
      <label class="inline" data-i18n-title="tiltTitle"><span data-i18n="tilt">Tilt</span>
        <input id="angle" type="number" min="-15" max="15" step="0.1" value="0.0">°
      </label>
      <span id="flagNote"></span>
    </div>
    <div id="stage">
      <div id="empty">
        <p><strong data-i18n="dropHere">Drop a scanned PDF here</strong><span data-i18n="dropOr"> or use “Open…”.</span></p>
        <p data-i18n="emptyImages">JPEG and PNG scans work too: select all the images at once.</p>
        <p data-i18n="emptyPrivacy">Everything runs in this browser tab. Your documents are never uploaded.</p>
      </div>
      <div id="wrap" hidden>
        <canvas id="view"></canvas>
        <div id="overlay"></div>
      </div>
    </div>
  </section>

  <aside id="settings">
    <h2 data-i18n="output">Output</h2>
    <label><span data-i18n="pageSize">Page size</span>
      <select id="paper">
        <option>A4</option><option>A5</option><option>A3</option><option>B5</option>
        <option>Letter</option><option>Legal</option><option value="custom" data-i18n="custom">Custom…</option>
      </select>
    </label>
    <div id="customRow" class="row" hidden>
      <label><span data-i18n="widthMm">Width (mm)</span><input id="cw" type="number" min="20" max="2000" value="210"></label>
      <label><span data-i18n="heightMm">Height (mm)</span><input id="ch" type="number" min="20" max="2000" value="297"></label>
    </div>
    <div class="row">
      <label><span data-i18n="orientation">Orientation</span>
        <select id="orient">
          <option value="portrait" data-i18n="portrait">Portrait</option>
          <option value="landscape" data-i18n="landscape">Landscape</option>
        </select>
      </label>
      <label><span data-i18n="marginMm">Margin (mm)</span><input id="margin" type="number" min="0" max="100" value="15"></label>
    </div>
    <label><span data-i18n="scaling">Scaling</span>
      <select id="scaling">
        <option value="common" data-i18n="scaleCommon">Fit to page, same scale for all</option>
        <option value="each" data-i18n="scaleEach">Fit each page separately</option>
        <option value="original" data-i18n="scaleOriginal">Original size</option>
      </select>
    </label>
    <div class="row">
      <label><span data-i18n="colour">Colour</span>
        <select id="mode">
          <option value="gray" data-i18n="gray">Greyscale</option>
          <option value="bw" data-i18n="bw">Black &amp; white</option>
          <option value="color" data-i18n="color">Colour</option>
        </select>
      </label>
      <label><span data-i18n="resolution">Resolution</span>
        <select id="dpi">
          <option value="150">150 dpi</option><option value="200">200 dpi</option>
          <option value="300" selected>300 dpi</option><option value="400">400 dpi</option>
          <option value="600">600 dpi</option>
        </select>
      </label>
    </div>
    <div id="bwRow" hidden>
      <label class="check"><input id="autoThr" type="checkbox" checked> <span data-i18n="autoThr">Automatic threshold</span></label>
      <label><span data-i18n="threshold">Threshold</span> <output id="thrOut">128</output><input id="thr" type="range" min="1" max="254" value="128" disabled></label>
    </div>
    <div id="qRow">
      <label><span data-i18n="quality">JPEG quality</span> <output id="qOut">80</output><input id="quality" type="range" min="40" max="95" value="80"></label>
    </div>
    <label class="check"><input id="deskew" type="checkbox" checked> <span data-i18n="deskew">Straighten tilted pages</span></label>
    <label class="check"><input id="clean" type="checkbox" checked> <span data-i18n="clean">Clean up the scan (white paper, no specks)</span></label>
    <label><span data-i18n="fileName">File name</span><input id="outName" type="text" spellcheck="false"></label>
    <div class="row">
      <button id="exportBtn" class="primary" disabled data-i18n="create">Create PDF</button>
      <button id="cancelBtn" hidden data-i18n="cancel">Cancel</button>
    </div>
    <progress id="progress" value="0" max="1" hidden></progress>

    <h2 data-i18n="preview">Preview</h2>
    <canvas id="preview"></canvas>
    <p id="previewInfo"></p>
  </aside>
</main>

<script src="vendor/pdf.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="src/i18n.js"></script>
<script src="src/detect.js"></script>
<script src="src/clean.js"></script>
<script src="src/app.js"></script>
</body>
</html>
